<rect x="30" y="525" width="22" height="16" rx="4" fill="#c8ecd6" stroke="#2e9e6b"/>
<text x="60" y="538" font-size="12.5" fill="#1f2328">R = cache read: this model already cached the block (cheap)</text>
<rect x="450" y="525" width="22" height="16" rx="4" fill="#ffd9b0" stroke="#d9822b"/>
<text x="480" y="538" font-size="12.5" fill="#1f2328">W = cache write: new to this model (full write price)</text>
<text x="30" y="571" font-size="12.5" fill="#57606a">Turns 1-3: each model sees the context for the first time and writes it once (cold write).</text>
<text x="30" y="591" font-size="12.5" fill="#57606a">Turn 4: Opus finds B1 in its own cache and reads it. It writes only B2-B4, added while Sonnet and Haiku ran.</text>
<text x="30" y="611" font-size="12.5" fill="#57606a">Turns 4-9: each switch reads that model's earlier prefix and writes the ~3 blocks the other two models added.</text>
<text x="30" y="631" font-size="12.5" fill="#57606a">Total over 9 turns: 24 block-writes instead of 9 with a single model (each block written once per model that sees it).</text>
<text x="30" y="651" font-size="12.5" fill="#57606a">Caches are per model and expire after 5 min idle (1 h extended); each read refreshes the timer.</text>
</svg>